<script>
    const cnv = document.getElementById ('Canvas');
    const ctx = cnv.getContext ('2d');
    cnv.width  = window.innerWidth
    cnv.height = window.innerHeight

// star mouse
    cnv.style.cursor = 'none';

    const cursorImg = new Image();
    cursorImg.src = 'star.png';

    let mouseX = 0;
    let mouseY = 0;

    cnv.addEventListener ('mousemove', (event) => {
        const rect = cnv.getBoundingClientRect();
        mouseX = event.clientX - rect.left;
        mouseY = event.clientY - rect.top;
  
        redrawCanvas();
    });
    
    function redrawCanvas() {
        ctx.drawImage (cursorImg, mouseX, mouseY, 15, 15);
    }
// star stamp
    function drawFrame(){

    cnv.addEventListener ('mousedown', (event) => {
        ctx.drawImage (cursorImg, mouseX, mouseY, 45, 45);
    })
        requestAnimationFrame (drawFrame);
    }
    requestAnimationFrame (drawFrame)

    const video = document.getElementById('webcam');
// Request permission to access the video stream
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then((stream) => {
        // Assign the camera stream to the video element
        video.srcObject = stream;
    })

    const stop_button = document.getElementById ('stop');
    const play_button = document.getElementById ('play');
    const pause_button = document.getElementById ('pause');

    const pig_button = document.getElementById ('pig');


//  moving videos
    let xP = (cnv.width /2) -320
    let yP = (cnv.height /2) -240

    let xspeed = 1
    let yspeed = 1


    play_button.addEventListener('click', function drawImage() {
        
        ctx.drawImage (video, xP, yP, 160, 120);

        // increment x position by 1
        xP = xP + xspeed
        yP = yP + yspeed

        // coding train bouncing dvd logo

       // conditional logic
        // if x position is greater than canvas width
        if (xP == (cnv.width /2) +160 || xP == (cnv.width /2) -320) {

            // bounce
            xspeed = xspeed * -1

        } 

        if (yP == (cnv.height /2) +120 || yP == (cnv.height /2) -240) {

            yspeed = yspeed * -1
        }

        requestAnimationFrame (drawImage)
    }, { once: true });

    pause_button.addEventListener('click', function drawImage() {

        ctx.drawImage (video, xP, (cnv.height /2) +117, 160, 120);


        ctx.drawImage (video, (-xP)+((cnv.width /2) +425), (cnv.height /2) -237, 160, 120);

        ctx.drawImage (cursorImg, xP +110, (cnv.height /2) -20, 45, 45);


        ctx.drawImage (video, (cnv.width /2) -317, yP, 160, 120);

        ctx.drawImage (video, (cnv.width /2) +157, (-yP)+((cnv.height /2)+260), 160, 120);


        // increment x position by 1
        xP = xP + xspeed
        yP = yP + yspeed

       // conditional logic
        // if x position is greater than canvas width
        if (xP == (cnv.width /2) +160 || xP == (cnv.width /2) -320) {

            xspeed = xspeed * -1

        } 

        if (yP == (cnv.height /2) +120 || yP == (cnv.height /2) -240) {

            yspeed = yspeed * -1
        }

        requestAnimationFrame (drawImage)

    }, { once: true });

        stop_button.addEventListener('click', function drawImage() {

        // ctx.drawImage (video, xP, (cnv.height /2) -60, 160, 120);
        // ctx.drawImage (video, (cnv.width /2) -80, (-yP)+((cnv.height /2)+260), 160, 120);

        // ctx.drawImage (video, (-xP)+((cnv.width /2) +425), (cnv.height /2) -235, 160, 120);
        // ctx.drawImage (video, (cnv.width /2) -160, yP, 160, 120);

        // ctx.drawImage (video, (cnv.width /2) -315, (-yP)+((cnv.height /2)+260), 160, 120);
        // ctx.drawImage (video, (cnv.width /2) +155, yP, 160, 120);

        // ctx.drawImage (video, xP, yP, 160, 120);
        ctx.drawImage (cursorImg, (-xP)+((cnv.width /2) +425),yP, 45, 45);
        ctx.drawImage (cursorImg, xP, (-yP)+((cnv.height /2)+260), 45, 45);
        ctx.drawImage (video, (-xP)+((cnv.width /2) +425), (-yP)+((cnv.height /2)+260), 160, 120);

        // increment x position by 1
        xP = xP + xspeed
        yP = yP + yspeed

       // conditional logic
        // if x position is greater than canvas width
        if (xP == (cnv.width /2) +160 || xP == (cnv.width /2) -320) {

            xspeed = xspeed * -1

        } 

        if (yP == (cnv.height /2) +120 || yP == (cnv.height /2) -240) {

            yspeed = yspeed * -1
        }

        requestAnimationFrame (drawImage)

    }, { once: true });



    function drawImage (){
    //  purple rectangle
        ctx.fillRect ((cnv.width /2) -320, (cnv.height /2) -240, 640, 480);
        ctx.fillStyle = 'rgba(100, 0, 240, 0.1)';

        

        const gradient = ctx.createLinearGradient(0, 0, 0, cnv.height);
         gradient.addColorStop("0", 'red');
         gradient.addColorStop("1.0", 'white');

// Fill with gradient
       ctx.strokeStyle = gradient;
       ctx.lineWidth = 5;
       ctx.strokeRect((cnv.width /2) -320, (cnv.height /2) -240, 640, 480);
        requestAnimationFrame (drawImage)
    }
    requestAnimationFrame (drawImage)


    
    pig_button.addEventListener('click', 
    function reloadPage() {
        location.reload();
    });

    


</script>

<!-- Ondrop event to exit the house: takes pig back to the 'outside' -->
    <script>

        const target = document.getElementById ('drop-box');

        window.ondragover = (event) => event.preventDefault ();
        window.ondrop = (event) => event.preventDefault ();

        target.ondragover = () => target.classList.add ('hover');
        target.ondragleave = () => target.classList.remove ('hover');

        target.ondrop = (event) => {
            event.preventDefault();
            target.classList.remove ('hover');

            if (target.ondrop) {
                //Navigate to the new webpage
                window.location.href = "https://s4290237.github.io/Assignment_2/mediaPlayer_P1.html";
            }
        };

    </script>

<!-- Creating an interacting space with confusing controls -->


<script>
    const cnv = document.getElementById ('Canvas');
    const ctx = cnv.getContext ('2d');
    cnv.width  = window.innerWidth
    cnv.height = window.innerHeight

    // star mouse
    cnv.style.cursor = 'none';

    const cursorImg = new Image();
    cursorImg.src = 'star.png';

    let mouseX = 0;
    let mouseY = 0;

    cnv.addEventListener ('mousemove', (event) => {
        const rect = cnv.getBoundingClientRect();
        mouseX = event.clientX - rect.left;
        mouseY = event.clientY - rect.top;
  
        redrawCanvas();
    });
    
    function redrawCanvas() {
        ctx.drawImage (cursorImg, mouseX, mouseY, 15, 15);
    }
    // star stamp
    function drawFrame(){

    cnv.addEventListener ('mousedown', (event) => {
        ctx.drawImage (cursorImg, mouseX , mouseY, 45 , 45);
    })
        requestAnimationFrame (drawFrame);
    }
    requestAnimationFrame (drawFrame)

 // customisation of the cursor for interactive and aesthetic purposes

    const video = document.getElementById('webcam');
        // Request permission to access the video stream
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then((stream) => {
        // Assign the camera stream to the video element
        video.srcObject = stream;
    })

    // button assignment for functions
    const stop_button = document.getElementById ('stop');
    const play_button = document.getElementById ('play');
    const pause_button = document.getElementById ('pause');

    const pig_button = document.getElementById ('pig');
    const music = document.getElementById ('sound');



//  moving videos
    let xP = (cnv.width /2) -320
    let yP = (cnv.height /2) -240

    let xspeed = 1
    let yspeed = 1


    play_button.addEventListener('click', function drawImagePlay() {
    
        ctx.drawImage (video, xP, yP, 160, 120);
        // ctx.drawImage (cursorImg, (-xP)+((cnv.width /2) +425),yP, 45, 45);
        // ctx.drawImage (cursorImg, xP, (-yP)+((cnv.height /2)+260), 45, 45);

        // increment x position by 1
        xP = xP + xspeed
        yP = yP + yspeed

        // coding train bouncing dvd logo

       // conditional logic
        // if x position is greater than canvas width
        if (xP == (cnv.width /2) +160 || xP == (cnv.width /2) -320) {

            // bounce
            xspeed = xspeed * -1

        } 

        if (yP == (cnv.height /2) +120 || yP == (cnv.height /2) -240) {

            yspeed = yspeed * -1
        }

        requestAnimationFrame (drawImagePlay)
    }, { once: true });

        pause_button.addEventListener('click', function drawImagePlay() {
 
        ctx.drawImage (cursorImg, (-xP)+((cnv.width /2) +540),yP, 45, 45);
        ctx.drawImage (cursorImg, xP, (-yP)+((cnv.height /2) +335), 45, 45);

        // increment x position by 1
        xP = xP + xspeed
        yP = yP + yspeed

        // coding train bouncing dvd logo

       // conditional logic
        // if x position is greater than canvas width
        if (xP == (cnv.width /2) +160 || xP == (cnv.width /2) -320) {

            // bounce
            xspeed = xspeed * -1

        } 

        if (yP == (cnv.height /2) +120 || yP == (cnv.height /2) -240) {

            yspeed = yspeed * -1
        }

        requestAnimationFrame (drawImagePlay)
    }, { once: true });


    pause_button.addEventListener ('click',function playAudio()  {
     // Get the audio element by its ID
       const audio = document.getElementById('sound');
  
      // Play the audio file
       audio.play()

    })

    stop_button.addEventListener ('click',function playAudio()  {
     // Get the audio element by its ID
        const audio = document.getElementById('sound2');
  
      // Play the audio file
        audio.play()

    })



    function drawImage (){
    //  purple rectangle
        ctx.fillRect ((cnv.width /2) -320, (cnv.height /2) -240, 640, 480);
        ctx.fillStyle = 'rgba(100, 45, 144, 0.1)';

        const gradient = ctx.createLinearGradient(0, 0, 0, cnv.height);
        gradient.addColorStop("0", 'red');
        gradient.addColorStop("1.0", 'white');

    // Fill with gradient
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 5;
        ctx.strokeRect((cnv.width /2) -320, (cnv.height /2) -240, 640, 480);
        requestAnimationFrame (drawImage)
    }
    requestAnimationFrame (drawImage)


    pig_button.addEventListener('click', function reloadPage() {

    });

</script>

<!DOCTYPE html>
<html lang="en">


<head>
    <title>ARTWEBSITE home</title>
        <style>
       #drop-box {
            width: 50px;
            height: 45px;
            border: 5px dashed #EE5427;
            border-radius: 10px;
            position: fixed;
            top: 55px;
            left: 60px;
            background: transparent;
        }

        #pig {
            position: fixed;
            top: 280px;
            left: 600px;
        }

        #home {
            position: fixed;
            top: 25px;
            left: 40px;
            width: 100px;

        } 
    </style>
</head>

<body>

    <img id = "pig" src = "pig.png" draggable = "true" ondragstart = "dragstartHandler(event)" width = "50px">

    <img id = "home" src = "home.png">
    <div id = "drop-box"></div>

    <script>

        const target = document.getElementById ('drop-box');
        
        window.ondragover = (event) => event.preventDefault ();
        window.ondrop = (event) => event.preventDefault ();

        target.ondragover = () => target.classList.add ('hover');
        target.ondragleave = () => target.classList.remove ('hover');

        target.ondrop = (event) => {
            event.preventDefault();
            target.classList.remove ('hover');

            if (target.ondrop) {
                window.location.href = "https://s4290237.github.io/Assignment_2/mediaPlayer_P2.html";
            }
        };
    </script>
</body>

</html>

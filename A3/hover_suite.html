<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hover Suite</title>
    <link rel="stylesheet" 
    href="https://fonts.googleapis.com/css?family=avenir">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>

<style>
  a.ex1:hover, a.ex1:active {color: red; background: black;}
  a.ex2:hover, a.ex2:active {font-size: 150%; font-family: Impact;}
  a.ex3:hover, a.ex3:active {color: white;background: red;}
  a.ex4:hover, a.ex4:active {font-family: avenir;}
  

    body {
      margin: 0;
      overflow: hidden;
     font-family: avenir, sans-serif;
      text-align: left;
      font-size: 20px;

      overflow: hidden;
      cursor: none;
     
    }

    .trail {
      position: fixed;
      background-color: black;
      
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.8;
      transform: translate(-50%, -50%);
      animation: fadeOut 0.8s ease-out forwards;
    }
     @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
    }

</style> 
    
<body>

    <p><a class="ex1" >This link changes color</a></p>
    <p><a class="ex2" >This link changes font-size</a></p>
    <p><a class="ex3" >This link changes background-color</a></p>
    <p><a class="ex4" >This link changes font-family</a></p>
    <p><a class="ex5" >This link changes text-decoration</a></p>

  <script>
  
   const sizes = ['6px', '10px', '20px']; 

   document.addEventListener('mousemove', function(e) {
    const trail = document.createElement('div');
    trail.className = 'trail';

    // const color = colors[Math.floor(Math.random() * colors.length)];
    // trail.style.backgroundColor = color;

    const size = sizes[Math.floor(Math.random() * sizes.length)];
    trail.style.width = size;
    trail.style.height = size;

    const spread  = 20;
    const offsetX = (Math.random() - 0.5) * spread; 
    const offsetY = (Math.random() - 0.5) * spread;
    trail.style.left = (e.clientX + offsetX) + 'px';
    trail.style.top = (e.clientY + offsetY) + 'px';

    document.body.appendChild(trail);

    setTimeout(function() {
      trail.remove();
    }, 800);

  });
  
  </script>

</body>


</html>

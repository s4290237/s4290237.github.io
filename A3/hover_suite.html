<style>

  .marquee {
    display: flex;
    width: 440px;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    color: gainsboro;
  }
  .marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 6s linear infinite;
  }


  @keyframes marquee {
    from { transform: translate(0)
    } 
    to {transform: translate(-100%)
    }
  }

  .box {
  display: flex;
  justify-content: left;
  align-items: center;
  height: 100px;
  width: 440px;
  border: transparent; 
  background-color: ivory;
  margin: 10px;
  padding: 10px;
  }

  
  
  body {
    place-items: center;
    background-color: oldlace;
    margin: 0;
    padding: 10px;
    overflow: hidden;

    font-family: georgia, serif;
    text-align: left;
    font-size: 28px;
    color: black;

    /* cursor: none; */
  }

  button {
    border: transparent;
    background-color: transparent;
    position: relative;
    font-family: georgia, serif;
    font-size: 28px;
    text-align: left;
    color: black;
  }
    
  .trail {
    position: fixed;
    background-color: black;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.8;
    transform: translate(-50%, -50%);
    animation: fadeOut 0.8s ease-out forwards;
  }

  .square {
    position: fixed;
    background-color: red;
    border-radius: 0%;
    pointer-events: none;
    opacity: 0.8;
    transform: translate(-50%, -50%);
    animation: fadeOut 2s ease-out forwards;
  }


  @keyframes fadeOut {
    to {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
    }
  }


  #shake:hover {
    animation: shake 0.1s;
    animation-iteration-count: infinite;

  }

  @keyframes shake {
    50% { transform: translate(-2px) ; }
    100% { transform: translate(2px); }
  }


  a.blackbg:hover {
    color: white; 
    background: black; 
    border-radius: 15%;
    font-style: italic;
  }
  a.font:hover {
    font-family: "comic sans ms", sans-serif;
    font-weight: bolder;
    font-style: italic;
  }
  a.impact:hover {
    font-family: impact;
    
  }
  a.red:hover {
    color: firebrick;
    font-style: italic;
  }
  a.bold:hover {
    font-style: bolder;
  }
  a.italic:hover {
    font-style: italic;
  }

</style>

<script>



  // scrambling text effect

  const letters = "@#$%⣿⣿⣿⣿⣿⣿⣿⣿xyz";
  const value = "'Flying Tesla'";

  let interval = null;
  const element = document.querySelector('[id="scram"]');

  element.addEventListener ('mouseover', (e) => {
    let iteration = 0;

    clearInterval(interval);
    interval = setInterval(() => {

      e.target.innerText = e.target.innerText
      .split("")
      .map((letter, index) => {
        if (index < iteration) {
          return value[index];
        } 
        return letters[Math.floor(Math.random() * 15)];
      }).join("");

      if (iteration >= value.length) {
        clearInterval(interval);
      }
      iteration += 1 / 5;
    }, 10);

  });


// red flash effect

  const target = document.querySelector('[id ="flash"]');

  target.addEventListener('mouseover', (e) => {

    const square = document.createElement('div');
    square.className = 'square';

    square.style.width = window.innerWidth + 'px';
    square.style.height = window.innerHeight + 'px';

    const spread  = 30;
    const offsetX = (Math.random() - 0.5) * spread; 
    const offsetY = (Math.random() - 0.5) * spread;

    square.style.left = (e.clientX + offsetX) + 'px';
    square.style.top = (e.clientY + offsetY) + 'px';

    document.body.appendChild(square);

    setTimeout(() => {
      square.remove();
    }, 2000);
  
  });

  // black blobs

    const target2 = document.querySelector('[id="blobs"]');

      trail.style.left = (e.clientX + offsetX) + 'px';
      trail.style.top = (e.clientY + offsetY) + 'px';

      document.body.appendChild(trail);
   
      setTimeout(() => {
       trail.remove();
      }, 800);
    });

  });

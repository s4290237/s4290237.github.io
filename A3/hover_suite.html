<!DOCTYPE html>
<html lang="en">
  <!-- The action chosen for this prototype was hover. Through investigation, it was 
   realised that hover or ‘mouseover’ events are commonly implemented on a 
   wide range of platforms and provide information with subtle communication 
   and functionality as priority. Taking the action and creating a more intentional 
   and engaging interaction, incorporating more design to the action had a lot 
   of potential. Using hover to add dynamic interactivity to what may otherwise 
   be plain text. -->

<head>
    <title>Hover Suite</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
  <!-- The suite of effects could be implemented onto various forms of desktop 
   media as the product is versatile and design focused. Deciding how the suite 
   of effects could be implemented more broadly and what purpose they could 
   serve took some further brainstorming. Identifying ways where the 
   application would elevate user experience. -->

<style>
  /* Marquee loop, added for aesthetic purposes in showcasing the example texts and how each action can be presented */
  .marquee {
    display: flex;
    width: 440px;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    color: gainsboro;
  }

  .marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 6s linear infinite;
  }

  @keyframes marquee {
    from { transform: translate(0)
    } 
    to {transform: translate(-100%)
    }
  }
  /* looping and stylisation tutorial from youtube – https://www.youtube.com/watch?v=BXKMkGhg2Bw */

  /* "news headline" columns */
  .box {
    display: flex;
    justify-content: left;
    align-items: center;
    height: 100px;
    width: 440px;
    border: transparent; 
    background-color: ivory;
    margin: 10px;
    padding: 10px;
    cursor: pointer;
  }
  
  body {
    place-items: center;
    background-color: oldlace;
    margin: 0;
    padding: 10px;

    font-family: georgia, serif;
    text-align: left;
    font-size: 28px;
    color: black;
  }

  /* button for the animated effects */
  button {
    border: transparent;
    background-color: transparent;
    position: relative;
    font-family: georgia, serif;
    font-size: 28px;
    text-align: left;
    color: black;
  }
  
  /* cursor trail created using pixelated trail tutorial — https://www.youtube.com/watch?v=lywTnNbRmlM */
  .trail {
    position: fixed;
    background-color: black;
    width: 6px;
    height: 6px;
    border-radius: 50%;
  
    pointer-events: none;
    opacity: 0.8;
    transform: translate(-50%, -50%);
    animation: fadeOut 0.8s ease-out forwards;
  }

  /* with some adjustments also used to create the flashing square effect */
  .square {
    position: fixed;
    background-color: red;
    border-radius: 0%;
    pointer-events: none;
    opacity: 0.8;
    transform: translate(-50%, -50%);
    animation: fadeOut 2s ease-out forwards;
  }

  @keyframes fadeOut {
    to {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
    }
  }

  /* image shake effect changed to shake selected text */
  #shake:hover {
    animation: shake 0.1s;
    animation-iteration-count: infinite;
    font-size: 32px;
    cursor: pointer;
  }
  
  @keyframes shake {
    50% { transform: translate(-2px) ; }
    100% { transform: translate(2px); }
  }

  /* text styling effects */
  #txtblur:hover {
    color: aliceblue;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.7); /* creates the blurred look */
    transition: all 0.5s ease;
    font-size: 32px;
    cursor: pointer;
  }

  a.bold:hover {
    font-style: bolder;
    transition: 0.5s;
  }

  a.italic:hover {
    font-style: italic;
    letter-spacing: 1px;
    transition: 0.5s;
  }

  a.font:hover {
    font-family: "comic sans ms", sans-serif;
    font-style: bolder;
    letter-spacing: 1px;
    transition: 0.5s;

  }
  a.impact:hover {
    font-family: impact;
    letter-spacing: 1px;
    transition: 0.5s;
  }
  a.red:hover {
    color: firebrick;
    font-style: italic;
    letter-spacing: 1px;
    transition: 0.5s;
  }
  a.blackbg:hover {
    color: white; 
    background: black; 
    font-size: 30px;
    font-style: italic;
    transition: 0.5s;
  }
</style> 
    
<body>
  <!-- Audience engagement on information in this digital age has become more 
   prominent. Important information such as the news are mostly consumed 
   online and rarely read further than the headlines. An example of how the 
   suite of effects could be used in context is in delivering news. Taking 
   inspiration from news headlines which are used to grasp the attention of the 
   viewer. Emphasis on attention-grabbing by adding visual effects for 
   engagement within the main content. Strategically placed effects throughout 
   the long form text enticing the audience to keep reading. -->

  <div class ="marquee">
    <span> SBS NEWS </span>
  </div>
  
  <!-- news headlines with texts effects implemented -->
  <div class = "box">
    <p>
      <a class = "font">Elon Musk unveils new</a><br> 
      <button id = "scram">..............</button>
    </p>
  </div>

  <div class = "box">
    <p>
     <a class ="impact">Suspect in custody after Haines <br>
      <button id = "flash"><a class ="impact">'attacked' outside office</a></button>
    </p>
  </div>

  <div class ="marquee";>
    <span> THE GUARDIAN </span>
  </div>

  <div class = "box">
    <p>
     <button id = "blobs"><a class ="red">AI is helping</a></button>
     workplaces more closely <a class="red">monitor employees</a>
    </p>
  </div>

  <div class ="box">
    <p>
     <button id = "shake">"Are your bones brittle?</button>
     If they were, <a class ="italic">how would you know?"</a>
    </p>
  </div>

  <div class ="marquee";>
    <span> AUS CONSERVATION</span>
  </div>

  <div class ="box">
    <p>
     <a class ="impact">Bird flu has reached Macquarie Island,</a> 
     <a class ="blackbg">a World Heritage listed wildlife sanctuary</a>
    </p>
  </div>

  <div class ="box">
    <p>
      <a class ="red">FRACKING:</a><a id ="txtblur"> The impact on our water</a>
    </p>
  </div>

  <!-- headlines are taken from The Guardian: https://www.theguardian.com/au
    news social media pages: sbsnews_au and ausconservation-->

</body>

<script>
// scrambling text effect - can be versatile when choosing the randomly 
// assigned scramble characters as well as starting or finishing text. 
// - https://www.youtube.com/watch?v=7QGoqt7ZIn4

//  symbols chosen over alphabet for a more chaotic effect
  const letters = "@#$%⣿⣿⣿⣿⣿@#%xyz";
  const value = "'FLYING TESLA'";

  let interval = null;
  const element = document.querySelector('[id="scram"]');

  element.addEventListener ('mouseover', (e) => {
    let iteration = 0;

    clearInterval(interval);
    interval = setInterval(() => {

      e.target.innerText = e.target.innerText
      .split("")
      .map((letter, index) => {
        if (index < iteration) {
          return value[index];
        } 
        return letters[Math.floor(Math.random() * 15)];
      }).join("");

      if (iteration >= value.length) {
        clearInterval(interval);
      }
      iteration += 1 / 5;
    }, 10);

  });

  // black blobs
    const target2 = document.querySelector('[id="blobs"]');

  target2.addEventListener('mouseleave', () => {
  // chosen different sizes rather than colours
    const sizes = ['10px', '15px', '20px']; 

    document.addEventListener('mousemove', (e) => {
      const trail = document.createElement('div');
      trail.className = 'trail';

      const size = sizes[Math.floor(Math.random() * sizes.length)];
      trail.style.width = size;
      trail.style.height = size;

      const spread  = 20;
      const offsetX = (Math.random() - 0.5) * spread; 
      const offsetY = (Math.random() - 0.5) * spread;
      trail.style.left = (e.clientX + offsetX) + 'px';
      trail.style.top = (e.clientY + offsetY) + 'px';

      document.body.appendChild(trail);
   
      setTimeout(() => {
       trail.remove();
      }, 800);
    });
  });

// red flash effect
  const target = document.querySelector('[id ="flash"]');

  target.addEventListener('mouseover', (e) => {

    const square = document.createElement('div');
    square.className = 'square';

    square.style.width = window.innerWidth + 'px';
    square.style.height = window.innerHeight + 'px';

    const spread  = 30;
    const offsetX = (Math.random() - 0.5) * spread; 
    const offsetY = (Math.random() - 0.5) * spread;

    square.style.left = (e.clientX + offsetX) + 'px';
    square.style.top = (e.clientY + offsetY) + 'px';

    document.body.appendChild(square);

    setTimeout(() => {
      square.remove();
    }, 2000);
  
  });
</script>

<!-- As the hover effect is a desktop specific function, finding a way to also
  implement the interaction for hand held devices would be an interesting 
  design challenge. A potential approach could be using webcam eye tracking 
  technology that was quite popular at a time. Using eye tracking as a way to 
  prompt the effects following the pace of reading. However, as it would be v
  ery intriguing, user privacy and security would be a concern and would need 
  to be heavily considered in this approach. -->
</html>

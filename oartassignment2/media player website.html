<script>
    const cnv = document.getElementById('Canvas');
    const ctx = cnv.getContext('2d');
    cnv.width = 1000;
    cnv.height = 980;

    function resizeCanvas () {
        cnv.width  = window.innerWidth
        cnv.height = window.innerHeight
    
    }

    resizeCanvas ()
    window.addEventListener ('resize', resizeCanvas)

    function reloadPage() {
       location.reload();
    }

    const video = document.getElementById('webcam');
// Request permission to access the video stream
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then((stream) => {
        // Assign the camera stream to the video element
        video.srcObject = stream;
    })
    


    // .catch((error) => {
    //     console.error("Error accessing the camera: ", error);
    //     alert("Could not access camera. Please check your permissions.");
    // });


// star mouse
    cnv.style.cursor = 'none';

    const cursorImg = new Image();
    cursorImg.src = 'goals_icon.png';

    let mouseX = 0;
    let mouseY = 0;

  cnv.addEventListener('mousemove', (draw) => {
    const rect = cnv.getBoundingClientRect();
    mouseX = draw.clientX - rect.left;
    mouseY = draw.clientY - rect.top;
  
  redrawCanvas();
  });

   function redrawCanvas() {
//   ctx.clearRect(0, 0, cnv.width, cnv.height);
     ctx.drawImage(cursorImg, mouseX, mouseY, 30, 30);
    }

    let x = -100
    cnv.onpointerdown = function drawVideo() {
        // ctx.drawImage(video,0,0,cnv.width,cnv.height);
        // ctx.drawImage(video, 0, 240, (x % 800 - 160), 120);
        // ctx.drawImage(video, mouseX, mouseY, 160, 120)
// video boxes moving
        ctx.drawVideo(video, (x % 800 - 160), 120, 160, 120);
        // ctx.drawImage(video, 0, (x % 600 - 120), 160, 120);
        // ctx.drawImage(video, -(x % 800 - 640), 0, 160, 120);
        // ctx.drawImage(video, 480, -(x % 600 - 480), 160, 120);
        
        // x++
        // ctx.fillRect(200, 100, 700, 500);
        // ctx.fillStyle = 'rgba(100, 0, 240, 0.1)';
        // ctx.fillRect(220, 120, 660, 460);
        // ctx.fillStyle = 'rgba(100, 0, 200, 0.2)';
    

        requestAnimationFrame (drawVideo)
    }
    requestAnimationFrame (drawVideo)
     
        const positions = []

    cnv.addEventListener ('mousedown', (event) => {

        // object literal syntax 
        // to create a new object with x and y properties
        const pos = {
            x: event.offsetX,
            y: event.offsetY
        }

        // add the new object to the positions array
        positions.push (pos)
    })


       function drawFrame () {


        // iterate through the positions array
        positions.forEach ((pos) => {

            // add a random offset to the x and y positions
            const xPos = pos.x 
            const yPos = pos.y

            ctx.drawImage (cursorImg, xPos, yPos)

        })

        requestAnimationFrame (drawFrame)
    }

    requestAnimationFrame (drawFrame)
